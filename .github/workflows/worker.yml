name: Deploy worker

# 用途：把 worker/ 部署到 Cloudflare Workers + D1（免费、固定地址、数据持久）
# 触发：推送改动 worker/ 或 wrangler.toml，或手动 Run workflow
# 前置：仓库 Secrets 要有 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / DEEPSEEK_API_KEY
# 没配密钥时整条流水线「跳过」而不是「失败」，避免仓库里出现红叉

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 把 secrets 提到 job 级 env，后面的 step 才能用 if 判断「有没有配」
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      # ---------- 没配密钥：打印提示就结束，不报错 ----------
      - name: Skip (未配置 Cloudflare 密钥)
        if: env.CF_TOKEN == ''
        run: |
          echo "::notice title=跳过 Worker 部署::仓库未配置 CLOUDFLARE_API_TOKEN，worker 部署已跳过"
          echo "如需启用：Settings → Secrets and variables → Actions 里加 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID"

      # ---------- 配了密钥才真正部署 ----------
      - name: Checkout
        if: env.CF_TOKEN != ''
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.CF_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        if: env.CF_TOKEN != ''
        run: npm i -g wrangler@3

      - name: Apply D1 schema
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute onelist --remote --file=worker/schema.sql

      - name: Push model key as Worker secret
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "$DEEPSEEK_KEY" | wrangler secret put DEEPSEEK_API_KEY

      - name: Deploy
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      # 部署完把访问地址打到日志里，便于回填 API_BASE
      - name: Show endpoint
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deployments list | head -20 || true
