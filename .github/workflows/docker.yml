name: Build container image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/y-yanxia/web-phase5-yyx:latest
            ghcr.io/y-yanxia/web-phase5-yyx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name onelist -p 3000:3000 \
            -e MOCK_AI=1 -e ALLOWED_ORIGINS=http://localhost:3000 \
            ghcr.io/y-yanxia/web-phase5-yyx:latest
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/items
          curl -fsS -X POST http://localhost:3000/api/items \
            -H 'Content-Type: application/json' -d '{"title":"容器冒烟测试"}'
          curl -sS -o /dev/null -w "missing-title status=%{http_code}\n" \
            -X POST http://localhost:3000/api/items \
            -H 'Content-Type: application/json' -d '{"due":"2026-11-25"}'
          docker rm -f onelist
