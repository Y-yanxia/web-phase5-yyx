name: Build container image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/y-yanxia/web-phase5-yyx:latest
            ghcr.io/y-yanxia/web-phase5-yyx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name onelist -p 3000:3000 \
            -e MOCK_AI=1 -e ALLOWED_ORIGINS=http://localhost:3000 \
            ghcr.io/y-yanxia/web-phase5-yyx:latest
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/items
          curl -fsS -X POST http://localhost:3000/api/items \
            -H 'Content-Type: application/json' -d '{"title":"容器冒烟测试"}'
          curl -sS -o /dev/null -w "missing-title status=%{http_code}\n" \
            -X POST http://localhost:3000/api/items \
            -H 'Content-Type: application/json' -d '{"due":"2026-11-25"}'
          docker rm -f onelist

      # 把同一个镜像再镜像一份到阿里云 ACR（国内 FC 拉取快）
      # 需要三个仓库 Secrets：ACR_REGISTRY / ACR_USERNAME / ACR_PASSWORD
      - name: Mirror image to Aliyun ACR
        if: env.ACR_REGISTRY != ''
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -e
          echo "镜像到 $ACR_REGISTRY"
          echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
          # 只拉 amd64 单平台：多架构 index 里带 buildkit 的 attestation 清单，
          # 阿里云 ACR 不接受 application/vnd.oci.empty.v1+json 这种 manifest 类型
          docker pull --platform linux/amd64 ghcr.io/y-yanxia/web-phase5-yyx:latest
          docker tag  ghcr.io/y-yanxia/web-phase5-yyx:latest "$ACR_REGISTRY/onelist/onelist-api:v1"
          docker push "$ACR_REGISTRY/onelist/onelist-api:v1"
          echo "完成：$ACR_REGISTRY/onelist/onelist-api:v1"
