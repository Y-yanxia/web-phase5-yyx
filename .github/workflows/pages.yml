name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (copy public + inject API base)
        run: |
          mkdir -p dist
          cp -r public/. dist/
          if [ -n "${{ vars.API_BASE }}" ]; then
            printf "/* 由 GitHub Actions 注入 */\nwindow.__API_BASE__ = '%s';\n" "${{ vars.API_BASE }}" > dist/config.js
            echo "API_BASE = ${{ vars.API_BASE }}"
          else
            echo "未配置 API_BASE，前端将请求同源 /api（Pages 上没有后端，会显示连接失败提示）"
          fi

          # 给静态资源加版本号：GitHub Pages 的 CDN 有 10 分钟缓存，
          # 文件名不变就会一直拿旧的 config.js（表现为「改了地址但页面还连老后端」）。
          # 用提交 SHA 做 query 参数，每次部署都是新 URL，绕开缓存。
          VER="${{ github.sha }}"
          sed -i "s|src=\"config.js\"|src=\"config.js?v=${VER}\"|" dist/index.html
          sed -i "s|href=\"style.css\"|href=\"style.css?v=${VER}\"|" dist/index.html
          sed -i "s|src=\"app.js\"|src=\"app.js?v=${VER}\"|" dist/index.html
          echo "已给静态资源加版本号：${VER:0:7}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 上传完成后 artifact 元数据有最终一致性延迟，立刻部署偶发 "Found 0 artifacts"。
      # 等 10 秒再部署，把这类偶发失败挡掉。
      - name: Wait for artifact consistency
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
